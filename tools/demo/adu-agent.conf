# ADU Gen2 Agent Configuration
# Ignite Demo

[agent]
device_id = "ignite-demo-device-001"
log_file = "/tmp/adu/adu-agent.bin"
log_level = 5  # Debug

[communication]
endpoint = "http://localhost:8080"
provider = "adu-direct"
poll_interval_sec = 10

[extensions]
load = [
    "/usr/lib/adu/extensions/adu_direct_comm.so",
    "/usr/lib/adu/extensions/libgen2_simulator_handler.so"
]

[extensions.simulator]
default_delay_ms = 100

[security]
cert_path = ""
key_path = ""

[download]
work_dir = "/tmp/adu/downloads"
max_retries = 3
