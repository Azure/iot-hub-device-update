name: CI
on:
  push:
  workflow_dispatch:
jobs:
  container-job:
    strategy:
      matrix:
        os: ["debian:12", "debian:11", "ubuntu:22.04", "ubuntu:20.04"]
        arch: [amd64, arm64]
        exclude:
          - os: "debian:10"
            arch: arm64
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-latest' }}
    container:
      image: ${{ matrix.os }}
      options: --platform linux/${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Make artifact name valid
        id: make-artifact-name-valid
        run: |
          OS_NAME=$(echo "${{ matrix.os }}" | tr ':' '-')
          echo "os_name=$OS_NAME" >> $GITHUB_OUTPUT
      - name: Install prereqs
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y tzdata
          dpkg-reconfigure -f noninteractive tzdata
      - name: Install dependencies
        run: |
          scripts/install-deps.sh --install-aduc-deps --install-do --install-cmake --install-shellcheck --install-delta
      - name: Build packages and tests
        run: scripts/build.sh --clean --build-unit-tests --build-packages --type MinSizeRel --delta-handler
      - name: Run tests
        run: |
          cd out
          ctest
      - name: Test package installation
        run: |
          echo "=== Testing Package Installation ==="
          ls -lh out/*.deb

          # Install the main agent package
          apt-get install -y ./out/deviceupdate-agent_*.deb

          # Verify installation
          echo "=== Verifying Installed Files ==="
          which AducIotAgent && echo "✓ AducIotAgent binary found" || echo "✗ AducIotAgent binary NOT found"
          which adu-shell && echo "✓ adu-shell binary found" || echo "✗ adu-shell binary NOT found"
          test -f /usr/lib/adu/libadushconst_exports.so && echo "✓ Core libraries installed" || echo "✗ Core libraries NOT installed"
          test -f /etc/adu/du-config.json && echo "✓ Configuration file installed" || echo "✗ Configuration file NOT installed"

          # If delta handler package exists, test it
          if ls out/deviceupdate-agent-delta-handler_*.deb 1> /dev/null 2>&1; then
            echo "=== Installing Delta Handler Package ==="
            apt-get install -y ./out/deviceupdate-agent-delta-handler_*.deb
            test -f /usr/lib/adu/extensions/sources/libmicrosoft_delta_download_handler.so && \
              echo "✓ Delta handler installed" || echo "✗ Delta handler NOT installed"
          else
            echo "Note: Delta handler package not found (expected if --delta-handler not used)"
          fi

          echo "=== Package Installation Test Complete ==="
      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages-${{ steps.make-artifact-name-valid.outputs.os_name }}-${{ matrix.arch }}
          path: out/*.deb
          retention-days: 3
