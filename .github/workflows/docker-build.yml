name: CI
on:
  push:
  workflow_dispatch:
jobs:
  container-job:
    strategy:
      fail-fast: false
      matrix:
        os: ["debian:13", "debian:12", "debian:11", "ubuntu:22.04", "ubuntu:20.04", "ubuntu:24.04"]
        arch: [amd64, arm64]
        exclude:
          # Ubuntu 20.04 arm64 uses aarch64-linux-gnu cross-compiler (GCC 9)
          # which doesn't support C++20 <span> required by delta library.
          # Ubuntu 20.04 reached end of standard support in April 2025.
          - os: "ubuntu:20.04"
            arch: arm64
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-latest' }}
    container:
      image: ${{ matrix.os }}
      options: --platform linux/${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Make artifact name valid
        id: make-artifact-name-valid
        run: |
          OS_NAME=$(echo "${{ matrix.os }}" | tr ':' '-')
          echo "os_name=$OS_NAME" >> $GITHUB_OUTPUT
      - name: Set up vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ steps.make-artifact-name-valid.outputs.os_name }}-${{ matrix.arch }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ steps.make-artifact-name-valid.outputs.os_name }}-${{ matrix.arch }}-
      - name: Install prereqs
        shell: bash
        run: |
          set -eo pipefail
          # Retry to absorb transient apt mirror failures (e.g. debian:11 arm64
          # has intermittently failed to fetch fakeroot during tzdata install).
          for i in 1 2 3; do
            apt-get update -o Acquire::Retries=5 \
              && DEBIAN_FRONTEND=noninteractive apt-get install -y --fix-missing -o Acquire::Retries=5 tzdata \
              && break
            echo "::warning::Install prereqs failed, retry $i/3"
            apt-get clean || true
            rm -rf /var/lib/apt/lists/* || true
            sleep $((i * 10))
          done
          dpkg-reconfigure -f noninteractive tzdata
      - name: Install dependencies (with ValGrind)
        if: matrix.os == 'ubuntu:22.04' || startsWith(matrix.os, 'ubuntu:2') && matrix.os >= 'ubuntu:22.04'
        shell: bash
        run: |
          set -eo pipefail
          for i in 1 2 3; do
            scripts/install-deps.sh --install-aduc-deps --install-do --install-cmake --install-shellcheck --install-valgrind apt --work-folder $GITHUB_WORKSPACE/.workspace && break
            echo "::warning::install-deps.sh failed, retry $i/3"
            apt-get update -o Acquire::Retries=5 || true
            sleep $((i * 10))
          done
      - name: Install dependencies (without ValGrind)
        if: matrix.os != 'ubuntu:22.04' && !(startsWith(matrix.os, 'ubuntu:2') && matrix.os >= 'ubuntu:22.04')
        shell: bash
        run: |
          set -eo pipefail
          for i in 1 2 3; do
            scripts/install-deps.sh --install-aduc-deps --install-do --install-cmake --install-shellcheck --work-folder $GITHUB_WORKSPACE/.workspace && break
            echo "::warning::install-deps.sh failed, retry $i/3"
            apt-get update -o Acquire::Retries=5 || true
            sleep $((i * 10))
          done
      - name: Build packages and tests
        run: scripts/build.sh --clean --build-unit-tests --build-packages --type MinSizeRel --work-folder $GITHUB_WORKSPACE/.workspace
      - name: Run tests
        run: |
          cd out
          ctest || ctest --rerun-failed --output-on-failure
      - name: Run tests with Valgrind (memory leak check)
        if: matrix.os == 'ubuntu:22.04' || startsWith(matrix.os, 'ubuntu:2') && matrix.os >= 'ubuntu:22.04'
        shell: bash
        run: |
          echo "Checking for Valgrind..."
          which valgrind || (echo "Valgrind not found in PATH" && exit 1)
          valgrind --version
          cd out
          ctest -T memcheck --output-on-failure
        continue-on-error: true
      - name: Upload Valgrind results
        if: always() && (matrix.os == 'ubuntu:22.04' || startsWith(matrix.os, 'ubuntu:2') && matrix.os >= 'ubuntu:22.04')
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-results-${{ steps.make-artifact-name-valid.outputs.os_name }}-${{ matrix.arch }}
          path: out/Testing/Temporary/MemoryChecker.*.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages-${{ steps.make-artifact-name-valid.outputs.os_name }}-${{ matrix.arch }}
          path: out/*.deb
          retention-days: 3
