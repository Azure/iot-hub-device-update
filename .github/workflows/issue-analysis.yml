name: Issue Analysis Report

on:
  # Run on demand
  workflow_dispatch:
    inputs:
      generate_visualizations:
        description: 'Generate visualization charts'
        required: false
        default: true
        type: boolean
      
  # Run weekly on Mondays at 9 AM UTC
  schedule:
    - cron: '0 9 * * 1'
    
  # Run when issues are opened/closed
  issues:
    types: [opened, closed, reopened]

permissions:
  issues: read
  contents: write
  pull-requests: write

jobs:
  analyze-issues:
    runs-on: ubuntu-latest
    name: Analyze Repository Issues
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        pip install -r .github/tools/requirements.txt
        
    - name: Run issue analysis
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python .github/tools/analyze_issues.py \
          --owner ${{ github.repository_owner }} \
          --repo ${{ github.event.repository.name }} \
          --token ${{ secrets.GITHUB_TOKEN }} \
          --output issue_analysis_report.md \
          ${{ github.event.inputs.generate_visualizations == 'true' && '--visualize' || '' }}
          
    - name: Upload analysis artifacts
      uses: actions/upload-artifact@v3
      with:
        name: issue-analysis-${{ github.run_id }}
        path: |
          issue_analysis_report.md
          issue_analysis/
          
    - name: Create issue comment with summary
      if: github.event_name == 'workflow_dispatch'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('issue_analysis_report.md', 'utf8');
          
          // Extract executive summary
          const summaryMatch = report.match(/## Executive Summary[\s\S]*?(?=\n---)/);
          const summary = summaryMatch ? summaryMatch[0] : 'Analysis complete!';
          
          // Create an issue with the summary
          const issue = await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `📊 Issue Analysis Report - ${new Date().toISOString().split('T')[0]}`,
            body: `${summary}\n\n[View Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n*Generated by GitHub Actions*`,
            labels: ['documentation', 'metrics']
          });
          
    - name: Update metrics dashboard
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      run: |
        mkdir -p .github/metrics
        cp issue_analysis_report.md .github/metrics/latest_analysis.md
        if [ -d "issue_analysis" ]; then
          cp -r issue_analysis/* .github/metrics/
        fi
        
    - name: Create Pull Request with metrics
      if: github.event_name == 'schedule'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update issue analysis metrics'
        title: '📊 Weekly Issue Analysis Update'
        body: |
          ## Weekly Issue Analysis Update
          
          This PR updates the issue analysis metrics for the week.
          
          ### Changes
          - Updated issue analysis report
          - Updated visualization charts (if enabled)
          
          ### Review the full report
          [View Analysis Report](.github/metrics/latest_analysis.md)
          
          *Auto-generated by GitHub Actions*
        branch: metrics/issue-analysis-${{ github.run_id }}
        delete-branch: true
